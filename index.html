<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flipper Speedometer</title>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; background: #121212; color: white; padding-top: 40px; }
        button { background: #ff8c00; color: black; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-bottom: 20px;}
        #speed { font-size: 5rem; font-weight: bold; margin: 20px 0; }
        #log { color: #888; font-family: monospace; font-size: 0.9rem; padding: 0 20px; word-break: break-all; }
    </style>
</head>
<body>
    <h2>Phone GPS Bridge</h2>
    <button id="connectBtn">Connect to Flipper</button>
    <div id="speed">0 MPH</div>
    <div id="log">Waiting to connect...</div>

    <script>
        const SERVICE_UUID = "8fe5b3d5-2e7f-4a98-2a48-7acc60fe0000";
        const RX_UUID = "19ed82ae-ed21-4c9d-4145-228e61fe0000";
        
        let rxCharacteristic;
        let latestMph = 0;
        let isWriting = false;

        document.getElementById('connectBtn').addEventListener('click', async () => {
            const log = document.getElementById('log');
            try {
                log.innerText = "Requesting Bluetooth Device...";
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                log.innerText = "Connecting to GATT Server...";
                const server = await device.gatt.connect();

                log.innerText = "Getting Serial Service...";
                const service = await server.getPrimaryService(SERVICE_UUID);

                log.innerText = "Getting RX Characteristic...";
                rxCharacteristic = await service.getCharacteristic(RX_UUID);

                log.innerText = "Connected! Streaming speed...";
                startGPS();
                startTransmissionLoop();
            } catch (error) {
                log.innerText = "BLE Error: " + error.message;
            }
        });

        function startGPS() {
            const speedDisplay = document.getElementById('speed');
            const log = document.getElementById('log');

            if (!navigator.geolocation) {
                log.innerText = "GPS Error: Geolocation not supported.";
                return;
            }

            navigator.geolocation.watchPosition(
                (position) => {
                    const speedMps = position.coords.speed;
                    latestMph = speedMps ? Math.round(speedMps * 2.23694) : 0;
                    speedDisplay.innerText = latestMph + " MPH";
                },
                (error) => { log.innerText = "GPS Error: " + error.message; },
                { enableHighAccuracy: true, maximumAge: 500 }
            );
        }

        // Send data on a stable 1-second interval to prevent GATT congestion
        function startTransmissionLoop() {
            const log = document.getElementById('log');
            setInterval(async () => {
                if (rxCharacteristic && !isWriting) {
                    isWriting = true;
                    try {
                        const encoder = new TextEncoder();
                        await rxCharacteristic.writeValue(encoder.encode(latestMph.toString() + "\n"));
                        log.innerText = "Successfully sent: " + latestMph;
                    } catch (err) {
                        log.innerText = "Write failed: " + err.message;
                    }
                    isWriting = false;
                }
            }, 1000);
        }
    </script>
</body>
</html>
